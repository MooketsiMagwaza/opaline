<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opaline</title>
    <link rel="stylesheet" href="/src/launcher.css" />
    <script type="module" src="/src/launcher.ts"></script>
  </head>

  <body data-style="frost" data-canvas="frosted" data-entry="fabric" data-labels="true" data-rail="false" data-rail-side="right" data-anim="true">
    <div class="stage pre" id="stage">
      <img id="backdrop" alt="" hidden />
      <div id="tint"></div>

      <div id="shell">
        <header id="top">
          <div class="search glass" id="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search desktop and installed apps" />
          </div>

          <div class="actions">
            <button type="button" class="orb glass" id="settings-button" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
                <circle cx="16" cy="7" r="2" />
                <circle cx="8" cy="17" r="2" />
              </svg>
            </button>
            <button type="button" class="orb glass" id="quit-button" title="Quit Opaline (Ctrl+Q)" aria-label="Quit Opaline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 3v8" />
                <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
              </svg>
            </button>
          </div>
        </header>

        <main id="apps-surface" class="glass page-surface" aria-label="Desktop apps and groups">
          <div id="grid-layer"><div id="grid"></div></div>
          <footer id="status"></footer>
        </main>

        <main id="app-list-surface" class="glass page-surface secondary-surface" aria-label="All apps" hidden>
          <header class="page-heading">
            <div><span class="page-kicker">Library</span><h1>All apps</h1></div>
            <span id="app-list-count" class="page-count"></span>
          </header>
          <div id="app-list" class="app-list"></div>
        </main>

        <nav id="page-nav" class="glass" aria-label="Launcher pages">
          <button type="button" id="page-prev" class="page-arrow" aria-label="Previous page">‹</button>
          <div class="page-position"><strong id="page-label">Home</strong><span id="page-dots" aria-hidden="true">● ○</span></div>
          <button type="button" id="page-next" class="page-arrow" aria-label="Next page">›</button>
        </nav>

        <aside id="rail" class="glass" aria-label="Taskbar" hidden></aside>
        <div id="preview" class="glass" hidden></div>

        <div id="popup-layer" hidden>
          <section id="popup" class="glass" aria-label="Pane"></section>
        </div>

        <aside id="settings" class="glass" aria-label="Settings" hidden></aside>
        <div id="menu" class="glass" hidden></div>
      </div>
    </div>
  </body>
</html>
