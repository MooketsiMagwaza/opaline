<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opaline</title>
    <link rel="stylesheet" href="/src/launcher.css" />
    <script type="module" src="/src/launcher.ts"></script>
  </head>

  <body data-style="frost" data-canvas="frosted" data-entry="fabric" data-labels="true" data-rail="false" data-anim="true">
    <div class="stage pre" id="stage">
      <img id="backdrop" alt="" hidden />
      <div id="tint"></div>

      <div id="shell">
        <header id="top">
          <div class="search glass" id="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search desktop and installed apps" />
          </div>

          <nav id="section-links" aria-label="Sections">
            <button type="button" data-page="all-apps">All apps</button>
            <button type="button" data-page="screen-time">Screen time</button>
            <button type="button" data-page="focus">Focus</button>
          </nav>

          <div class="actions">
            <button type="button" class="orb glass" id="settings-button" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
                <circle cx="16" cy="7" r="2" />
                <circle cx="8" cy="17" r="2" />
              </svg>
            </button>
            <button type="button" class="orb glass" id="quit-button" title="Quit Opaline (Ctrl+Q)" aria-label="Quit Opaline">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 3v8" />
                <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
              </svg>
            </button>
          </div>
        </header>

        <main id="apps-surface" class="glass page-surface" aria-label="Desktop apps and groups">
          <div id="grid-layer"><div id="grid"></div></div>
          <footer id="status"></footer>
        </main>

        <main id="app-list-surface" class="glass page-surface secondary-surface" aria-label="All apps" hidden>
          <header class="page-heading">
            <div><span class="page-kicker">Library</span><h1>All apps</h1></div>
            <span id="app-list-count" class="page-count"></span>
          </header>
          <div id="app-list" class="app-list"></div>
        </main>

        <main id="workspace-surface" class="glass page-surface secondary-surface" aria-label="Workspace" hidden>
          <header class="page-heading"><div><span class="page-kicker">Workspace</span><h1 id="workspace-title">Dev tools</h1></div><span id="workspace-count" class="page-count"></span></header>
          <div id="workspace-items" class="app-list"></div>
          <details class="workspace-add"><summary>Add a folder or file</summary><form id="workspace-path-form" class="workspace-editor"><input id="workspace-path" class="workspace-name" type="text" placeholder="Full folder or file path" aria-label="Full folder or file path" required /><button type="submit" class="chip">Add to this space</button></form><p id="workspace-path-note" class="note" role="status"></p></details>
        </main>

        <main id="screen-time-surface" class="glass page-surface secondary-surface" aria-label="Screen time" hidden>
          <header class="page-heading"><div><span class="page-kicker">On this device</span><h1>Screen time</h1></div><strong id="usage-total" class="usage-total">0 sec</strong></header>
          <div class="usage-toolbar"><span>Period</span><button id="usage-period" type="button" class="chip" aria-haspopup="menu" aria-label="Screen-time period">Today ▾</button><button id="usage-refresh" type="button" class="chip">Refresh</button><button id="usage-all-apps" type="button" class="chip" hidden>All apps</button></div>
          <div class="page-scroll">
          <p id="usage-status" class="row-hint" role="status"></p>
          <div id="usage-insights" class="usage-insights"></div>
          <div id="usage-chart"></div>
          <div id="usage-list" class="usage-list"></div>
          </div>
        </main>

        <main id="focus-surface" class="glass page-surface secondary-surface" aria-label="Focus" hidden>
          <header class="page-heading"><div><span class="page-kicker">One thing at a time</span><h1>Focus</h1></div><span id="focus-completed" class="page-count">0 today</span></header>
          <div class="page-scroll">
            <div class="segmented timer-phases" role="group" aria-label="Pomodoro phase"><button type="button" data-timer-phase="work">Focus</button><button type="button" data-timer-phase="short-break">Short break</button><button type="button" data-timer-phase="long-break">Long break</button></div>
            <div class="focus-session"><div id="focus-progress" class="timer-ring"><div><span id="focus-phase" class="page-kicker">Focus</span><strong id="focus-clock" aria-live="off">25:00</strong></div></div><div class="focus-copy"><h2>Give this moment your attention.</h2><p id="focus-note" class="row-hint" role="status"></p><div class="focus-buttons"><button id="focus-start" type="button" class="chip primary">Start</button><button id="focus-reset" type="button" class="chip">Reset session</button></div></div></div>
            <div class="focus-modes"><button id="focus-zen" type="button" class="mode-card"><strong>Zen mode</strong><span>Slowly changing reminders. Space to think.</span></button><button id="focus-saver" type="button" class="mode-card"><strong>Screen saver</strong><span>A quiet clock. Move or press a key to return.</span></button></div>
            <div id="focus-chart"></div>
          </div>
        </main>

        <p id="navigation-note" role="status"></p>
        <nav id="page-nav" aria-label="Workspaces and page cycling">
          <button type="button" id="page-prev" class="page-arrow" aria-label="Previous page">‹</button>
          <div id="page-tabs"></div>
          <div class="page-position"><strong id="page-label" aria-live="polite">Desktop</strong></div>
          <button type="button" id="page-next" class="page-arrow" aria-label="Next page">›</button>
          <button type="button" id="bar-toggle" class="page-arrow" title="Compact bar (Ctrl+B)" aria-label="Collapse to taskbar view" aria-expanded="true">⌄</button>
        </nav>

        <aside id="rail" class="glass" aria-label="Taskbar" hidden></aside>
        <div id="preview" class="glass" hidden></div>
        <div id="tile-peek" class="glass" role="status" hidden></div>

        <div id="popup-layer" hidden>
          <section id="popup" class="glass" aria-label="Pane"></section>
        </div>

        <aside id="settings" class="glass" aria-label="Settings" hidden></aside>
        <div id="menu" class="glass" hidden></div>
      </div>
      <section id="ambient" role="dialog" aria-modal="true" aria-labelledby="ambient-title" hidden>
        <button id="ambient-close" type="button" class="chip ambient-close">Return · Esc</button>
        <div id="ambient-content"><span id="ambient-title" class="page-kicker">A little room to think</span><strong id="ambient-clock"></strong><span id="ambient-date"></span><blockquote id="zen-quote"></blockquote><span id="zen-position" class="row-hint"></span><span id="ambient-timer"></span></div>
        <div class="zen-controls"><button id="zen-prev" type="button" class="chip" aria-label="Previous quote">←</button><button id="zen-pause" type="button" class="chip">Pause quotes</button><button id="zen-next" type="button" class="chip" aria-label="Next quote">→</button></div>
      </section>
    </div>
  </body>
</html>
