<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opaline</title>
    <link rel="stylesheet" href="/src/launcher.css" />
    <script type="module" src="/src/launcher.ts"></script>
  </head>

  <body data-style="frost" data-canvas="frosted" data-labels="true" data-rail="false" data-anim="true">
    <div class="stage pre" id="stage">
      <img id="backdrop" alt="" hidden />
      <div id="tint"></div>

      <div id="shell">
        <header id="top">
          <nav id="header-left" class="header-nav glass" aria-label="Apps and screen time">
            <button type="button" class="orb" data-page="all-apps" title="All apps" aria-label="All apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></button>
            <button type="button" class="orb" data-page="screen-time" title="Screen time" aria-label="Screen time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"/><rect x="5" y="11" width="3.5" height="6" rx=".8"/><rect x="10.25" y="7" width="3.5" height="10" rx=".8"/><rect x="15.5" y="4" width="3.5" height="13" rx=".8"/></svg></button>
          </nav>
          <div class="search glass" id="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search desktop and installed apps" />
          </div>

          <nav id="header-right" class="header-nav glass" aria-label="Focus and settings">
            <button type="button" class="orb" data-page="focus" title="Focus" aria-label="Focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".7" fill="currentColor" stroke="none"/></svg></button>
            <button type="button" class="orb" data-page="settings" id="settings-button" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
                <circle cx="16" cy="7" r="2" />
                <circle cx="8" cy="17" r="2" />
              </svg>
            </button>
          </nav>
        </header>

        <main id="apps-surface" class="glass page-surface" aria-label="Desktop apps and groups">
          <div id="grid-layer"><div id="grid"></div></div>
          <footer class="home-footer"><span id="status"></span><nav id="home-pages" class="home-pages" aria-label="Home screens"></nav></footer>
        </main>

        <main id="app-list-surface" class="glass page-surface secondary-surface" aria-label="All apps" hidden>
          <header class="page-heading">
            <div><span class="page-kicker">Library</span><h1>All apps</h1></div>
            <span id="app-list-count" class="page-count"></span>
          </header>
          <div id="app-list" class="app-list"></div>
        </main>

        <main id="workspace-surface" class="glass page-surface secondary-surface" aria-label="Workspace" hidden>
          <header class="page-heading"><h1 id="workspace-title">Screen 2</h1><button id="workspace-add-trigger" type="button" class="chip">+ Add app or folder</button></header>
          <div id="workspace-items" class="app-list"></div>
          <nav id="workspace-pages" class="home-pages" aria-label="Home screens"></nav>
        </main>

        <section id="item-picker" class="glass" aria-label="Add to screen" hidden><header class="picker-heading"><h2 id="picker-title">Add to screen</h2><button id="picker-close" type="button" class="chip">Close</button></header><div class="workspace-picker"><label for="workspace-app-search">Find a Windows app</label><input id="workspace-app-search" type="search" placeholder="Search installed apps…" autocomplete="off"/><div id="workspace-app-results" class="workspace-app-results" aria-label="Matching installed apps"></div><div class="workspace-picker-actions"><button type="button" id="workspace-browse-folder" class="chip">Choose folder…</button><button type="button" id="workspace-browse-file" class="chip">Choose file…</button></div><details class="workspace-path-fallback"><summary>Enter a path instead</summary><form id="workspace-path-form" class="workspace-editor"><input id="workspace-path" class="workspace-name" type="text" placeholder="Full folder or file path" aria-label="Full folder or file path" required /><button type="submit" class="chip">Add path</button></form></details><p id="workspace-path-note" class="note" role="status"></p></div></section>

        <main id="screen-time-surface" class="glass page-surface secondary-surface" aria-label="Screen time" hidden>
          <header class="page-heading"><div><span class="page-kicker">On this device</span><h1>Screen time</h1></div><strong id="usage-total" class="usage-total">0 sec</strong></header>
          <div class="usage-toolbar"><span>Period</span><button id="usage-period" type="button" class="chip" aria-haspopup="menu" aria-label="Screen-time period">Today ▾</button><button id="usage-refresh" type="button" class="chip">Refresh</button><button id="usage-all-apps" type="button" class="chip" hidden>All apps</button></div>
          <div class="page-scroll">
          <p id="usage-status" class="row-hint" role="status"></p>
          <div id="usage-insights" class="usage-insights"></div>
          <div id="usage-chart"></div>
          <div id="usage-list" class="usage-list"></div>
          </div>
        </main>

        <main id="focus-surface" class="glass page-surface secondary-surface" aria-label="Focus" hidden>
          <header class="page-heading"><div><span class="page-kicker">One thing at a time</span><h1>Focus</h1></div><span id="focus-completed" class="page-count">0 today</span></header>
          <div class="page-scroll">
            <section class="focus-workbench" aria-label="Pomodoro timer"><div class="segmented timer-phases" role="group" aria-label="Pomodoro phase"><button type="button" data-timer-phase="work">Focus</button><button type="button" data-timer-phase="short-break">Short break</button><button type="button" data-timer-phase="long-break">Long break</button></div><div class="focus-session"><div id="focus-progress" class="timer-ring"><div><span id="focus-phase" class="page-kicker">Focus</span><strong id="focus-clock" aria-live="off">25:00</strong></div></div><div class="focus-copy"><h2>One clear session.</h2><p id="focus-note" class="row-hint" role="status"></p><div class="focus-buttons"><button id="focus-start" type="button" class="chip primary">Start</button><button id="focus-reset" type="button" class="chip">Reset session</button></div></div></div></section>
            <div class="focus-modes"><button id="focus-zen" type="button" class="mode-card"><span class="mode-glyph" aria-hidden="true">✧</span><span><strong>Zen mode</strong><small>Quiet quotes for a clearer mind</small></span><span class="mode-arrow" aria-hidden="true">↗</span></button><button id="focus-saver" type="button" class="mode-card"><span class="mode-glyph" aria-hidden="true">◷</span><span><strong>Screen saver</strong><small>A calm clock until you return</small></span><span class="mode-arrow" aria-hidden="true">↗</span></button></div>
            <div id="focus-chart"></div>
          </div>
        </main>

        <main id="settings-surface" class="glass page-surface secondary-surface" aria-label="Settings" hidden><header class="page-heading"><div><span class="page-kicker">Personalise Opaline</span><h1>Settings</h1></div><span class="page-count">Changes apply automatically</span></header><div id="settings" class="settings-layout"></div></main>

        <p id="navigation-note" role="status"></p>
          <span id="gesture-cue" aria-hidden="true" hidden></span>
          <nav id="page-edges" aria-label="Home screen navigation">
          <button type="button" id="page-prev" class="edge-arrow" aria-label="Previous Home screen" title="Previous Home screen · Shift+Tab">‹</button>
          <button type="button" id="page-next" class="edge-arrow" aria-label="Next Home screen" title="Next Home screen · Tab">›</button>
        </nav>

        <div id="bottom-bar"><button id="home-dock" type="button" class="glass" title="Home · Alt+1" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.7 10 8.3-6.8 8.3 6.8v9.1c0 1-.8 1.8-1.8 1.8h-13c-1 0-1.8-.8-1.8-1.8z"/><path d="M9.2 20.9v-6.6h5.6v6.6"/></svg></button><aside id="rail" class="glass" aria-label="Taskbar" hidden></aside></div>
        <div id="preview" class="glass" hidden></div>
        <div id="tile-peek" class="glass" role="status" hidden></div>

        <div id="popup-layer" hidden>
          <section id="popup" class="glass" aria-label="Pane"></section>
        </div>

        <div id="menu" class="glass" hidden></div>
      </div>
      <section id="ambient" role="dialog" aria-modal="true" aria-labelledby="ambient-title" hidden>
        <button id="ambient-close" type="button" class="chip ambient-close">Return · Esc</button>
        <div id="ambient-content" class="glass"><span id="ambient-title" class="page-kicker">A little room to think</span><strong id="ambient-clock"></strong><span id="ambient-date"></span><blockquote id="zen-quote"></blockquote><span id="zen-position" class="row-hint"></span><span id="ambient-timer"></span></div>
        <div class="zen-controls"><button id="zen-prev" type="button" class="chip" aria-label="Previous quote">←</button><button id="zen-pause" type="button" class="chip">Pause quotes</button><button id="zen-next" type="button" class="chip" aria-label="Next quote">→</button></div>
      </section>
    </div>
  </body>
</html>
