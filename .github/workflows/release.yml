name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify tag and package versions agree
        shell: pwsh
        run: |
          $expected = "${{ github.ref_name }}".TrimStart("v")
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if (@($npm, $tauri, $cargo) | Where-Object { $_ -ne $expected }) {
            throw "Tag $expected does not match npm=$npm, tauri=$tauri, cargo=$cargo"
          }

      - run: npm run tauri build -- --bundles nsis,msi

      - name: Package portable binary and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -LiteralPath "src-tauri/target/release/opaline.exe" -DestinationPath "opaline-$tag-windows-x64-portable.zip"
          $files = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File
            Get-Item "opaline-$tag-windows-x64-portable.zip"
          )
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            opaline-${{ github.ref_name }}-windows-x64-portable.zip
            SHA256SUMS.txt
