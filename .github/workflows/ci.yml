name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check and bundle the UI
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Known vulnerabilities in JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Documentation matches the code
        run: npm run docs:check

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust build check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on a known vulnerability. Warnings about unmaintained crates are reported but do not fail the build:
      # the ones in the lockfile today belong to Tauri's Linux stack and are not compiled for Windows.
      - name: Known vulnerabilities in Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  # Linux is a planned port (WORKORDER WP10). Enable this job once the non-Windows paths exist.
  # linux:
  #   runs-on: ubuntu-latest
  #   steps: [...]
