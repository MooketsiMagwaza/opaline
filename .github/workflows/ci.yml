name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check and bundle the UI
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust build check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Linux is a planned port (WORKORDER WP10). Enable this job once the non-Windows paths exist.
  # linux:
  #   runs-on: ubuntu-latest
  #   steps: [...]
