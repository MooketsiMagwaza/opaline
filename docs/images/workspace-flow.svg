<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Opaline workspace navigation</title><desc id="desc">Numbered spaces in the corner: Alt+1 Desktop, Alt+2 Dev tools, Alt+3 Projects. All apps and Screen time are separate destinations. The taskbar mirror stays at the bottom.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111724"/><stop offset="1" stop-color="#25324a"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#394151"/><stop offset="1" stop-color="#1c2434"/></linearGradient></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f2f5ff">
    <text x="58" y="66" font-size="30" font-weight="600">A space for each kind of work</text>
    <text x="58" y="102" font-size="17" fill="#b4bfd3">Your apps and folders, organised without moving your files.</text>
    <g transform="translate(58 145)"><rect width="200" height="48" rx="16" fill="#303b50" stroke="#59657a"/><rect x="7" y="7" width="34" height="34" rx="10" fill="#6f8bae"/><g font-size="16" text-anchor="middle"><text x="24" y="30">1</text><text x="63" y="30">2</text><text x="102" y="30">3</text><text x="144" y="30">▦</text><text x="180" y="30">◷</text></g></g>
    <text x="282" y="176" font-size="15" fill="#b4bfd3">Numbered corner switcher · Shift+Tab cycles pages</text>
    <g transform="translate(58 230)">
      <rect width="340" height="220" rx="24" fill="url(#panel)" stroke="#566174"/><text x="26" y="42" font-size="14" fill="#b4bfd3">ALT + 1</text><text x="26" y="78" font-size="26" font-weight="600">Desktop</text>
      <g transform="translate(26 109)" fill="#8dadde"><rect width="56" height="56" rx="15"/><rect x="74" width="56" height="56" rx="15" fill="#c1a0e0"/><rect x="148" width="56" height="56" rx="15" fill="#e5bf71"/></g>
      <text x="26" y="194" font-size="15" fill="#b4bfd3">Panes → apps and files</text>
    </g>
    <g transform="translate(430 230)">
      <rect width="340" height="220" rx="24" fill="url(#panel)" stroke="#566174"/><text x="26" y="42" font-size="14" fill="#b4bfd3">ALT + 2</text><text x="26" y="78" font-size="26" font-weight="600">Dev tools</text><text x="26" y="124" font-size="18">Editor · Terminal · Containers</text><text x="26" y="155" font-size="18">Projects folder</text><text x="26" y="194" font-size="15" fill="#b4bfd3">Pin apps from Desktop or All apps</text>
    </g>
    <g transform="translate(802 230)">
      <rect width="340" height="220" rx="24" fill="url(#panel)" stroke="#566174"/><text x="26" y="42" font-size="14" fill="#b4bfd3">ALT + 3</text><text x="26" y="78" font-size="26" font-weight="600">Projects</text><text x="26" y="124" font-size="18">Source code · Design files</text><text x="26" y="155" font-size="18">Notes and reference folders</text><text x="26" y="194" font-size="15" fill="#b4bfd3">Name your own spaces in Settings</text>
    </g>
    <rect x="290" y="491" width="620" height="66" rx="22" fill="#303b50" stroke="#59657a"/>
    <g transform="translate(330 508)"><g fill="#aacdf5"><rect width="12" height="12" rx="3"/><rect x="17" width="12" height="12" rx="3"/><rect y="17" width="12" height="12" rx="3"/><rect x="17" y="17" width="12" height="12" rx="3"/></g><rect x="70" width="32" height="32" rx="9" fill="#8dadde"/><rect x="124" width="32" height="32" rx="9" fill="#c1a0e0"/><rect x="178" width="32" height="32" rx="9" fill="#71c0b8"/><text x="236" y="22" font-size="17">Pinned + running Windows apps</text></g>
    <text x="600" y="602" text-anchor="middle" font-size="16" fill="#b4bfd3">Ctrl+B collapses navigation · Windows virtual desktops keep working</text>
  </g>
</svg>
